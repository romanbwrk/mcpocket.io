# MCPocket v1 — one container (dashboard + REST + MCP HTTP/SSE in a single
# Next.js process) with its data on a persistent named volume.
#
#   cp .env.example .env   # set MCPOCKET_ADMIN_PASSWORD, API keys, secrets
#   docker compose up -d --build
#   open http://localhost:3000
#
# Storage runs in-process (JSON files, or one SQLite file with
# STORAGE_DRIVER=sqlite — no database container) behind an in-process write
# lock: run exactly ONE replica (do not `docker compose up --scale mcpocket=2`).
name: mcpocket

services:
  mcpocket:
    build: .
    image: mcpocket:${MCPOCKET_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixed inside the container; change the host side with MCPOCKET_PORT.
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # json | sqlite (see README "Storage drivers").
      STORAGE_DRIVER: sqlite
      DATA_DIR: /app/data
      SQLITE_FILE: mcpocket.db
      # Fail fast instead of starting a dashboard nobody can sign in to.
      MCPOCKET_ADMIN_PASSWORD: ${MCPOCKET_ADMIN_PASSWORD:?set MCPOCKET_ADMIN_PASSWORD in .env (see .env.example)}
    ports:
      - "${MCPOCKET_PORT:-3000}:3000"
    volumes:
      - mcpocket-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mcpocket-data:
